<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity MF Selection & Monitoring — Dashboard</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <h1>Equity MF Selection &amp; Monitoring</h1>
    <small id="mast-sub">Loading the scored universe…</small>
  </div>
  <div class="spacer"></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-view="overview" aria-current="page">Overview</button>
    <button data-view="whitelist">Whitelist</button>
    <button data-view="screener">Screener</button>
    <button data-view="categories">Categories</button>
    <button data-view="holdings">Holdings &amp; overlap</button>
    <button data-view="portfolio">Portfolio</button>
    <button data-view="monitoring">Monitoring</button>
    <button data-view="framework">Framework</button>
  </nav>
  <button class="icon-btn" id="theme-toggle" title="Toggle light / dark">◐</button>
</header>

<main>
  <section class="view active" id="view-overview"><div class="loading">Loading…</div></section>
  <section class="view" id="view-whitelist"><div class="loading">Loading…</div></section>
  <section class="view" id="view-screener"><div class="loading">Loading…</div></section>
  <section class="view" id="view-categories"><div class="loading">Loading…</div></section>
  <section class="view" id="view-holdings"><div class="loading">Loading…</div></section>
  <section class="view" id="view-portfolio"><div class="loading">Loading…</div></section>
  <section class="view" id="view-monitoring"><div class="loading">Loading…</div></section>
  <section class="view" id="view-framework"><div class="loading">Loading…</div></section>
</main>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="tooltip" id="tooltip" role="status"></div>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
