<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutual Fund Screener</title>
<link rel="stylesheet" href="/static/styles.css">

<header id="masthead">
  <div class="brand">
    <h1>Mutual fund screener</h1>
    <p>Actively managed equity: every fund read against its own category</p>
  </div>
  <div class="masthead-right">
    <div id="viewtoggle" class="segmented" role="group" aria-label="Presentation mode">
      <button data-mode="client" class="on" aria-pressed="true">Client</button>
      <button data-mode="analyst" aria-pressed="false">Analyst</button>
    </div>
    <div id="buildmeta" class="buildmeta"></div>
  </div>
</header>

<nav id="tabs" role="tablist">
  <button data-view="approach" role="tab">How we look at funds</button>
  <button data-view="shortlist" role="tab" class="on">Category top funds</button>
  <button data-view="all" role="tab">All funds</button>
  <button data-view="portfolio" role="tab">Portfolio</button>
</nav>

<main id="main" aria-live="polite">
  <div class="loading">Loading the universe…</div>
</main>

<footer id="pagefoot">
  <span>Avendus Wealth Management &middot; Public Market Solutions</span>
  <span class="mark" aria-label="Avendus">&#94;</span>
</footer>

<div id="tooltip" role="tooltip" aria-hidden="true"></div>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
