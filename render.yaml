# Render blueprint. Deploy with: New → Blueprint → point at this repo.
#
# The app is self-contained at runtime: data/*.json is committed, so nothing
# here needs the source workbook, the whitelist PDF or a live API call. The
# dataset is refreshed by running etl/build_dataset.py locally and committing
# the result, not by the server at boot.
services:
  - type: web
    name: mf-selection-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --preload evaluates the universe once before forking, so both workers share
    # it copy-on-write. Measured at ~105 MB per worker with the yfinance/pandas
    # stack imported, against the free plan's 512 MB.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --preload --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
